name: Build and test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Start simulator
      run: |
        xcodebuild -runFirstLaunch
        xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
        device_id=$(jq -er '.devices["com.apple.CoreSimulator.SimRuntime.iOS-18-5"][]
          | select(.name == "iPhone 16") | .udid' "$RUNNER_TEMP/simulators.json")
        echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
        state=$(jq -er --arg id "$device_id" '.devices[][]
          | select(.udid == $id) | .state' "$RUNNER_TEMP/simulators.json")
        if [ "$state" != "Booted" ]; then
          xcrun simctl boot "$device_id"
        fi

    - name: Set up Ruby and install gems
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.12'
        bundler-cache: true

    - name: Install pods
      run: |
        cd FBSnapshotTestCaseDemo
        bundle exec pod install

    - name: Wait for simulator
      run: xcrun simctl bootstatus "$SIMULATOR_ID" -b

    - name: Build and test
      shell: bash
      run: |
        set -o pipefail
        cd FBSnapshotTestCaseDemo
        xcodebuild -workspace FBSnapshotTestCaseDemo.xcworkspace \
          -scheme FBSnapshotTestCaseDemo -sdk iphonesimulator \
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=arm64" \
          -resultBundlePath TestResults.xcresult \
          test | bundle exec xcpretty -c

    - name: Upload failed test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: FBSnapshotTestCaseDemo/TestResults.xcresult
        if-no-files-found: warn
